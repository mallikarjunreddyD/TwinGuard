[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "twinguard"
version = "0.7.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "numpy>=1.26,<3", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "trimesh>=4.5,<5", "sqlalchemy>=2,<3"]
[project.optional-dependencies]
edge = ["sqlalchemy>=2,<3", "alembic>=1,<2", "psycopg[binary]>=3,<4", "paho-mqtt>=2,<3", "asyncua>=1.1,<2", "scipy>=1.13,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML"]
viz = ["matplotlib>=3.9,<4"]
sensing = ["open3d>=0.19,<0.20"]
analytics = ["open3d>=0.19,<0.20", "scipy>=1.13,<2"]
[project.scripts]
twinguard = "twinguard.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
